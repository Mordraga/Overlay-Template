<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fansly BRB — The Crypt</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --black:     #080808;
    --deep:      #0f0d0f;
    --surface:   #141014;
    --surface2:  #1a141a;
    --border:    #2a1f2a;
    --border2:   #3a2a3a;
    --accent:    #8b1a1a;
    --gold:      #c9a84c;
    --gold-dim:  #8a6e2e;
    --gold-pale: #e8d49a;
    --text:      #d4c9d4;
    --text-dim:  #7a6d7a;
    --text-mute: #4a3f4a;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--black);
    font-family: 'Cormorant Garamond', serif;
  }

  /* ── BACKGROUND ── */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 50%, rgba(139,26,26,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 20% 80%, rgba(201,168,76,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 80% 20%, rgba(139,26,26,0.05) 0%, transparent 60%);
  }

  /* ── NOISE OVERLAY ── */
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    opacity: 0.4;
    pointer-events: none;
  }

  /* ── CORNER BRACKETS ── */
  .corner {
    position: absolute;
    width: 80px;
    height: 80px;
    border-color: var(--border2);
    border-style: solid;
    opacity: 0.6;
  }
  .corner-tl { top: 40px; left: 40px; border-width: 1px 0 0 1px; }
  .corner-tr { top: 40px; right: 40px; border-width: 1px 1px 0 0; }
  .corner-bl { bottom: 40px; left: 40px; border-width: 0 0 1px 1px; }
  .corner-br { bottom: 40px; right: 40px; border-width: 0 1px 1px 0; }

  /* ── HORIZONTAL BARS ── */
  .bar-top, .bar-bottom {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--gold), var(--accent), transparent);
  }
  .bar-top    { top: 0; }
  .bar-bottom { bottom: 0; }

  /* ── CENTER CONTENT ── */
  .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  /* ── SIGIL ROW ── */
  .sigil-row {
    font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: 1em;
    margin-bottom: 2rem;
    animation: sigilPulse 4s ease-in-out infinite;
  }

  @keyframes sigilPulse {
    0%, 100% { opacity: 0.5; text-shadow: none; }
    50% { opacity: 1; text-shadow: 0 0 20px rgba(139,26,26,0.8); }
  }

  /* ── MAIN TITLE ── */
  .title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 7rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.15em;
    line-height: 1;
    margin-bottom: 0.5rem;
    animation: goldShimmer 6s ease-in-out infinite;
    background: linear-gradient(
      90deg,
      var(--gold-dim) 0%,
      var(--gold) 20%,
      var(--gold-pale) 40%,
      var(--gold) 60%,
      var(--gold-dim) 80%,
      var(--gold) 100%
    );
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  @keyframes goldShimmer {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  /* ── TAGLINE ── */
  .tagline {
    font-family: 'Cinzel Decorative', serif;
    font-size: 1rem;
    color: var(--text-mute);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    margin-bottom: 3rem;
    animation: fadeSlowly 3s ease-in-out infinite alternate;
  }

  @keyframes fadeSlowly {
    from { opacity: 0.4; }
    to   { opacity: 0.8; }
  }

  /* ── DIVIDER LINE ── */
  .divider {
    width: 400px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border2), transparent);
    margin-bottom: 3rem;
  }

  /* ── LABEL ── */
  .label {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.6em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    animation: fadeSlowly 4s ease-in-out infinite alternate;
  }

  /* ── FANSLY CTA BLOCK ── */
  .fansly-cta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 2.5rem;
  }

  .fansly-teasers {
    position: relative;
    width: 600px;
    height: 1.6rem;
  }

  .fansly-teaser {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--text);
    letter-spacing: 0.03em;
    opacity: 0;
    animation: teaserCycle 12s ease-in-out infinite;
  }
  .fansly-teaser:nth-child(1) { animation-delay: 0s; }
  .fansly-teaser:nth-child(2) { animation-delay: 4s; }
  .fansly-teaser:nth-child(3) { animation-delay: 8s; }

  @keyframes teaserCycle {
    0%, 5%   { opacity: 0; transform: translateY(4px); }
    10%, 28% { opacity: 1; transform: none; }
    33%, 100% { opacity: 0; transform: translateY(-4px); }
  }

  .fansly-handle {
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    font-weight: 600;
    color: var(--gold);
    animation: handleGlow 3s ease-in-out infinite;
  }

  @keyframes handleGlow {
    0%, 100% { text-shadow: 0 0 6px rgba(201,168,76,0.25); }
    50%      { text-shadow: 0 0 18px rgba(201,168,76,0.65); }
  }

  .fansly-tag {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* ── ANIMATED DOTS ── */
  .dots span {
    display: inline-block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
    margin: 0 6px;
    animation: dotPulse 1.5s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.3s; }
  .dots span:nth-child(3) { animation-delay: 0.6s; }

  @keyframes dotPulse {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 8px var(--accent); }
  }

  /* ── BOTTOM STRIP ── */
  .bottom-strip {
    position: absolute;
    bottom: 60px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3rem;
  }

  .bottom-item {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.45rem;
    color: var(--text-mute);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    opacity: 0.6;
  }

  .bottom-sep {
    color: var(--accent);
    font-size: 0.6rem;
    opacity: 0.4;
  }

  /* ── FLOATING PARTICLES ── */
  .particle {
    position: absolute;
    width: 1px;
    height: 1px;
    background: var(--gold);
    border-radius: 50%;
    animation: float linear infinite;
    opacity: 0;
  }

  @keyframes float {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.3; }
    100% { transform: translateY(-400px) translateX(var(--drift)); opacity: 0; }
  }

  /* ── ACCENT GLOW ORBS ── */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    animation: orbPulse 8s ease-in-out infinite;
  }
  .orb-red {
    width: 600px; height: 300px;
    background: rgba(139,26,26,0.06);
    top: 60%; left: 50%;
    transform: translate(-50%, -50%);
    animation-delay: 0s;
  }
  .orb-gold {
    width: 400px; height: 200px;
    background: rgba(201,168,76,0.04);
    top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    animation-delay: 4s;
  }

  @keyframes orbPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="orb orb-red"></div>
<div class="orb orb-gold"></div>

<div class="bar-top"></div>
<div class="bar-bottom"></div>

<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div class="center">
  <div class="sigil-row">⸸ ✦ ⸸</div>
  <h1 class="title">YOUR NAME</h1>
  <p class="tagline">Your &nbsp;·&nbsp; Tagline &nbsp;·&nbsp; Here</p>
  <div class="divider"></div>
  <div class="label">Away From Keys</div>

  <div class="fansly-cta">
    <div class="fansly-teasers">
      <span class="fansly-teaser">further rites await below</span>
      <span class="fansly-teaser">uncensored & unchained</span>
      <span class="fansly-teaser">join the coven, if you dare</span>
    </div>
    <span class="fansly-handle">fansly.com/yourname</span>
    <span class="fansly-tag">18+ · exclusive rites</span>
  </div>

  <div class="dots">
    <span></span><span></span><span></span>
  </div>
</div>

<div class="bottom-strip">
  <span class="bottom-item">The Crypt</span>
  <span class="bottom-sep">⸸</span>
  <span class="bottom-item">twitch.tv/yourname</span>
  <span class="bottom-sep">⸸</span>
  <span class="bottom-item">she / they</span>
</div>

<script>
  // Floating particles
  const count = 30;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `
      left: ${Math.random() * 100}%;
      bottom: ${Math.random() * 20}%;
      width: ${Math.random() * 3 + 1}px;
      height: ${Math.random() * 3 + 1}px;
      --drift: ${(Math.random() - 0.5) * 200}px;
      animation-duration: ${Math.random() * 8 + 6}s;
      animation-delay: ${Math.random() * 8}s;
    `;
    document.body.appendChild(p);
  }
</script>

</body>
</html>
